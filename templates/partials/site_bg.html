{% load static %}
<!-- Site-Wide Background Atmosphere (Fixed, Pointer-events: none, Z-index: -1) -->
<div class="site-bg" id="site-bg" aria-hidden="true">
    <!-- Spotlight Glow that follows cursor -->
    <div class="site-bg__spotlight"></div>

    <!-- 4 Layered Ambient Radial Glows -->
    <div class="site-bg__glow site-bg__glow--indigo-tr"></div>
    <div class="site-bg__glow site-bg__glow--cyan-bl"></div>
    <div class="site-bg__glow site-bg__glow--indigo-ml"></div>
    <div class="site-bg__glow site-bg__glow--cyan-br"></div>

    <!-- Fine Fading Dot Grid (brightened around cursor) -->
    <div class="site-bg__dot-grid"></div>

    <!-- 3 Thin Circle Outlines -->
    <div class="site-bg__circle site-bg__circle--1"></div>
    <div class="site-bg__circle site-bg__circle--2"></div>
    <div class="site-bg__circle site-bg__circle--3"></div>

    <!-- Small Floating Shapes (Hexagon, Ring, Dashed Circle, Square) -->
    <div class="site-bg__shape site-bg__shape--hex"></div>
    <div class="site-bg__shape site-bg__shape--ring1"></div>
    <div class="site-bg__shape site-bg__shape--ring2"></div>
    <div class="site-bg__shape site-bg__shape--dashed"></div>
    <div class="site-bg__shape site-bg__shape--square"></div>
</div>
