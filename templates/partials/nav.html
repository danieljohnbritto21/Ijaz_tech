{% load static %}
<!-- Navigation -->
<nav class="nav" id="main-nav" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">

        <a href="{% url 'home' %}" class="nav__brand" aria-label="Ijaz_Solutions Home">
            <img src="{% static 'images/logo-mark.svg' %}" alt="IS" width="38" height="38" class="nav__brand-img">
            <span class="nav__brand-text">IJAZ<span class="brand-underscore">_</span>SOLUTIONS</span>
        </a>
        
        <!-- Desktop Menu -->
        <div class="nav__menu" id="nav-menu">
            <a href="{% url 'home' %}" class="nav__link {% if request.resolver_match.url_name == 'home' %}nav__link--active{% endif %}">Home</a>
            <a href="{% url 'services' %}" class="nav__link {% if 'services' in request.path %}nav__link--active{% endif %}">Capabilities</a>
            <a href="{% url 'portfolio' %}" class="nav__link {% if 'work' in request.path %}nav__link--active{% endif %}">Our Services</a>
            <a href="{% url 'about' %}" class="nav__link {% if request.resolver_match.url_name == 'about' %}nav__link--active{% endif %}">About Us</a>
            <a href="{% url 'process' %}" class="nav__link {% if request.resolver_match.url_name == 'process' %}nav__link--active{% endif %}">Our Process</a>
            <a href="{% url 'insights' %}" class="nav__link {% if request.resolver_match.url_name == 'insights' %}nav__link--active{% endif %}">Insights</a>
            <a href="{% url 'contact' %}" class="nav__link {% if request.resolver_match.url_name == 'contact' %}nav__link--active{% endif %}">Contact</a>
        </div>
        
        <!-- CTA -->
        <a href="{% url 'contact' %}" class="btn btn--primary btn--sm btn--magnetic nav__cta">Start a Project</a>
        
        <!-- Mobile Toggle -->
        <button class="nav__toggle" id="nav-toggle" aria-label="Toggle mobile menu" aria-expanded="false" aria-controls="nav-mobile-menu">
            <span class="nav__toggle-bar"></span>
            <span class="nav__toggle-bar"></span>
            <span class="nav__toggle-bar"></span>
        </button>
    </div>
    
    <!-- Mobile Menu -->
    <div class="nav__mobile-menu" id="nav-mobile-menu" role="menu">
        <a href="{% url 'home' %}" class="nav__mobile-link {% if request.resolver_match.url_name == 'home' %}nav__mobile-link--active{% endif %}" role="menuitem">Home</a>
        <a href="{% url 'services' %}" class="nav__mobile-link {% if 'services' in request.path %}nav__mobile-link--active{% endif %}" role="menuitem">Capabilities</a>
        <a href="{% url 'portfolio' %}" class="nav__mobile-link {% if 'work' in request.path %}nav__mobile-link--active{% endif %}" role="menuitem">Our Services</a>
        <a href="{% url 'about' %}" class="nav__mobile-link {% if request.resolver_match.url_name == 'about' %}nav__mobile-link--active{% endif %}" role="menuitem">About Us</a>
        <a href="{% url 'process' %}" class="nav__mobile-link {% if request.resolver_match.url_name == 'process' %}nav__mobile-link--active{% endif %}" role="menuitem">Our Process</a>
        <a href="{% url 'insights' %}" class="nav__mobile-link {% if request.resolver_match.url_name == 'insights' %}nav__mobile-link--active{% endif %}" role="menuitem">Insights</a>
        <a href="{% url 'contact' %}" class="nav__mobile-link {% if request.resolver_match.url_name == 'contact' %}nav__mobile-link--active{% endif %}" role="menuitem">Contact</a>
        <div class="nav__mobile-cta">
            <a href="{% url 'contact' %}" class="btn btn--primary btn--lg" style="width:100%;" role="menuitem">Start a Project</a>
        </div>
    </div>
</nav>
