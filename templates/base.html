{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>{% block title %}Ijaz_Solutions — Smart Technology. Practical Solutions.{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Ijaz_Solutions provides AI automation, custom software development, web & mobile applications, and IT consulting services. Smart technology for real business impact.{% endblock %}">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Ijaz_Solutions — Technology Solutions{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Smart Technology. Practical Solutions. Real Business Impact.{% endblock %}">
    <meta property="og:site_name" content="Ijaz_Solutions">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_css %}{% endblock %}
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/logo-mark.svg' %}">
</head>
<body>
    {% include 'partials/nav.html' %}
    
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    
    {% include 'partials/footer.html' %}
    
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
