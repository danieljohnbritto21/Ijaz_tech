<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
    <defs>
        <!-- Gradients matching brand guide -->
        <linearGradient id="cyanTop" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4BF0FF" />
            <stop offset="100%" stop-color="#22D3EE" />
        </linearGradient>
        <linearGradient id="cyanMid" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00D2FF" />
            <stop offset="100%" stop-color="#0080FF" />
        </linearGradient>
        <linearGradient id="blueMid" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0084FF" />
            <stop offset="100%" stop-color="#0055D4" />
        </linearGradient>
        <linearGradient id="blueDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#004BB8" />
            <stop offset="100%" stop-color="#002B7A" />
        </linearGradient>
        <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#35D9F5" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Isometric "IS" Monogram -->
    <g filter="url(#cyanGlow)">
        <!-- "i" Dot (Isometric Diamond/Rhombus) -->
        <polygon points="56,36 78,24 78,40 56,52" fill="url(#cyanTop)" />
        
        <!-- "i" Stem -->
        <!-- Front vertical facet -->
        <polygon points="56,58 78,46 78,114 56,126" fill="url(#cyanMid)" />
        <!-- Bottom angled facet connecting towards base -->
        <polygon points="56,126 78,114 94,124 72,136" fill="url(#blueMid)" />

        <!-- "S" Upper Loop -->
        <!-- Top right slope -->
        <polygon points="86,48 116,30 146,48 116,66" fill="url(#cyanTop)" />
        <!-- Outer right vertical face -->
        <polygon points="146,48 146,74 116,92 116,66" fill="url(#blueMid)" />
        <!-- Inner fold under top slope -->
        <polygon points="116,66 116,92 86,74 86,48" fill="url(#blueDark)" />

        <!-- "S" Central Ribbon / Downward Fold -->
        <!-- Center connecting ribbon face -->
        <polygon points="86,74 116,92 116,118 86,100" fill="url(#cyanMid)" />
        
        <!-- "S" Lower Loop -->
        <!-- Lower right fold face -->
        <polygon points="116,92 146,110 146,136 116,118" fill="url(#cyanTop)" />
        <!-- Bottom left connecting wrap -->
        <polygon points="72,136 94,124 146,154 124,166" fill="url(#cyanMid)" />
        <!-- Bottom fold shadow/depth facet -->
        <polygon points="116,118 146,136 146,154 116,136" fill="url(#blueDark)" />
    </g>
</svg>
